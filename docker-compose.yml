# Local PostgreSQL and Mailpit for development: `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "56432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the test database app_test the first time the volume is created.
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends locally; nothing leaves the machine. Read them at http://localhost:56026.
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "56025:1025" # SMTP (SMTP_PORT in .env)
      - "56026:8025" # web interface

volumes:
  postgres-data:
